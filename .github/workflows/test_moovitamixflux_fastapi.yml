name: Build and Test

on:
  # Manual trigger from the GitHub UI
  workflow_dispatch:
    
  # Automatic trigger on push to 'develop' branch
  push:
    branches:
      - develop
    paths-ignore:
      - '.github/workflows/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker Compose services
      - name: Build Docker Compose services
        run: docker compose build

      # Run the Docker Compose services
      - name: Run Docker Compose services
        run: 
          docker compose --profile test up --exit-code-from test_moovitamixflux_fastapi 

      # Copy the test results
      - name: Copy the test results
        run: 
          docker compose cp test_moovitamixflux_fastapi:/app/report.xml ./report.xml

      # Stop the Docker Compose services
      - name: Stop Docker Compose services
        run: docker compose down

      # Surface failing tests
      - name: Surface failing tests
        if: always()
        uses: pmeier/pytest-results-action@main
        with:
          # A list of JUnit XML files, directories containing the former, and wildcard
          # patterns to process.
          # See @actions/glob for supported patterns.
          path: report.xml
      
          # (Optional) Add a summary of the results at the top of the report
          summary: true
      
          # (Optional) Select which results should be included in the report.
          # Follows the same syntax as `pytest -r`
          display-options: fEX
      
          # (Optional) Fail the workflow if no JUnit XML was found.
          fail-on-empty: true
      
          # (Optional) Title of the test results section in the workflow summary
          title: Test results
