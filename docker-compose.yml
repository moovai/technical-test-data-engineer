services:
  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: moovitamix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  etl: 
    image: moovitamix_etl:latest
    restart: always
    environment:
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: moovitamix
      DB_HOST: db
      MOOVITAMIX_API_URL: http://api:8000
    depends_on:
      - db
      - api
    volumes:
      - ./etl:/app/etl
      - ./logs:/app/logs

  api:
    image: moovitamix_fastapi:latest
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: moovitamix
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
      - ./logs:/app/logs

volumes:
  postgres_data: