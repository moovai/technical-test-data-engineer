version: '3.8'
services:
  fastapi:
    build:
      context: ./src/moovitamix_fastapi
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./src/moovitamix_fastapi:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      fastapi:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./test:/app/test
      - ./data:/app/data
      - ./logs:/app/logs
      - ./run_pipeline.sh:/app/run_pipeline.sh
    command: /app/run_pipeline.sh

volumes:
  data:
  logs: